{% extends "base.html" %}
{% block title %}Parent Registration - Student Attendance System{% endblock %}
{% block content %}
<h1>Parent Registration</h1>
<form method="POST" id="parent-register-form">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br>
    <label for="confirm_password">Confirm Password:</label>
    <input type="password" id="confirm_password" name="confirm_password" required><br>
    <label for="student_id">Select Your Child:</label>
    <select id="student_id" name="student_id" required>
        <option value="">-- Select a student --</option>
        {% for student in students %}
        <option value="{{ student.id }}">{{ student.name }} (Grade {{ student.grade_level }}, Section {{ student.section.name }})</option>
        {% endfor %}
    </select>
    <br>
    <label for="mobile">Mobile Number:</label>
    <input type="text" id="mobile" name="mobile" required><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br>
    <button type="submit">Register</button>
</form>


{% endblock %}
